<!-- Trans flag -->
<span class="rye-flag-shortcode rye-trans-flag-shortcode">
    {{ with resources.Get "images/svg/flags/trans.svg" }}
    {{ $transSVG := . | resources.Minify }}
    <img src="{{ $transSVG.RelPermalink }}" alt="Transgender flag" class="flag-image" loading="lazy">
    {{ end }}
</span>
