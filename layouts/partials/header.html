<header class="site-header">
    <nav>
        <div class="nav-left">
            {{ partial "logo.html" . }}
        </div>

        <div class="nav-links">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | absLangURL }}" class="nav-link">{{ .Name }}</a>
            {{ end }}
        </div>

        {{ partial "header/controls.html" . }}
    </nav>

    <!-- Sliding Search Form -->
    <div class="search-form-container" id="searchForm">
        <div class="search-form">
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" placeholder="Search posts..." autocomplete="off">
                <button class="search-submit" type="button">
                    <span>🔍</span>
                </button>
                <button class="search-close" type="button">
                    <span>✕</span>
                </button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>
</header>
