<!-- Meta Description -->
{{ if .Description }}
<meta name="description" content="{{ .Description | truncate 160 | safeHTML }}" />
{{ else if .IsHome }}
<meta name="description" content="{{ .Site.Params.description | truncate 160 | safeHTML }}" />
{{ else }}
<meta name="description" content="{{ .Summary | truncate 160 | safeHTML }}" />
{{ end }}
